[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-sdk"
version = "0.12.3"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Synchronized side-by-side and swipe maps for Jupyter and standalone HTML: compare 2-8 linked map panels without a JavaScript build."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "gis",
    "multimap",
    "multilayer",
    "geovisualization",
    "spatial-comparison",
    "synchronized-maps",
    "side-by-side",
    "curtain-swipe",
    "geojson",
    "geopandas",
    "leaflet",
    "dashboard",
    "urban-planning",
    "headless",
    "swipe-map",
    "map-comparison",
    "jupyter",
    "interactive-maps",
    "web-mapping",
    "folium-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
geo = [
    "shapely>=2.0.0",
    "geopandas>=0.12.0",
]
notebook = [
    "ipython>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
multilayer = "multilayer.cli:main"

[project.urls]
Homepage = "https://geophilo.com/"
Repository = "https://github.com/YusufEminoglu/multilayer-sdk"
Issues = "https://github.com/YusufEminoglu/multilayer-sdk/issues"
Documentation = "https://geophilo.com/multilayer-sdk/"
Changelog = "https://github.com/YusufEminoglu/multilayer-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multilayer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".venv",
    "build",
    "dist",
    "build_multilayer_docs.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["multilayer"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
