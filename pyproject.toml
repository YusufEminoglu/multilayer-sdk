[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-sdk"
version = "0.12.1"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Pure-Python Synchronized Multi-Panel Map Visualization, Proximity Matrix Heatmaps & Radar POIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "gis",
    "multimap",
    "multilayer",
    "geovisualization",
    "spatial-comparison",
    "synchronized-maps",
    "side-by-side",
    "curtain-swipe",
    "geojson",
    "geopandas",
    "leaflet",
    "dashboard",
    "urban-planning",
    "headless",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
geo = [
    "shapely>=2.0.0",
    "geopandas>=0.12.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
multilayer = "multilayer.cli:main"

[project.urls]
Homepage = "https://geophilo.com/"
Repository = "https://gitlab.com/geospacephilo/multilayer-sdk"
Issues = "https://gitlab.com/geospacephilo/multilayer-sdk/-/issues"
Documentation = "https://geophilo.com/multilayer-sdk/"
Changelog = "https://gitlab.com/geospacephilo/multilayer-sdk/-/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multilayer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".venv",
    "build",
    "dist",
    "build_multilayer_docs.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["multilayer"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
